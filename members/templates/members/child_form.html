<fieldset class="member-child">
    <legend>Child details</legend>
    {{ child.non_field_errors }}
    {% for field in child.hidden_fields %}{{ field }}{{ field.errors }}{% endfor %}
    <div class="members-fields">
        {% for field in child.visible_fields %}<div>{{ field.as_field_group }}</div>{% endfor %}
    </div>
</fieldset>
